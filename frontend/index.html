<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Rentora – Smart Furniture &amp; Appliance Rentals</title>
    <meta name="description" content="Rent premium furniture and appliances in Mumbai, Pune, Bangalore, Delhi NCR and more. Flexible monthly plans, free maintenance, and zero down-payment with Rentora." />
    <meta name="keywords" content="furniture rental, appliance rental, rent furniture, rent AC, rent washing machine, rent sofa, rent TV, Rentora, India" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.rentora.in/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.rentora.in/" />
    <meta property="og:title" content="Rentora – Smart Furniture &amp; Appliance Rentals" />
    <meta property="og:description" content="Rent premium furniture and appliances across India. Flexible plans, free maintenance, ESG-certified products." />
    <meta property="og:image" content="https://www.rentora.in/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@RentoraIndia" />
    <meta name="twitter:title" content="Rentora – Smart Furniture &amp; Appliance Rentals" />
    <meta name="twitter:description" content="Rent premium furniture and appliances across India. Flexible plans, free maintenance." />
    <meta name="twitter:image" content="https://www.rentora.in/og-image.png" />

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Theme: set before React mounts to prevent flash -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('rentora_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>
      <div style="padding:2rem;text-align:center;font-family:sans-serif;">
        Please enable JavaScript to use Rentora.
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
